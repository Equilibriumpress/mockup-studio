function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}const dbp=new Promise((res,rej)=>{const r=indexedDB.open('mockup-studio',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('projects'))r.result.createObjectStore('projects')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});async function saveLocal(){project.updatedAt=new Date().toISOString();try{const db=await dbp;await new Promise((res,rej)=>{const tx=db.transaction('projects','readwrite');tx.objectStore('projects').put(project,'autosave');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch{localStorage.setItem('mockup-studio-autosave',JSON.stringify(project))}$('#saveState').textContent='Saved locally'}function queueSave(){$('#saveState').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,450)}async function loadLocal(){try{const db=await dbp,stored=await new Promise((res,rej)=>{const tx=db.transaction('projects','readonly'),r=tx.objectStore('projects').get('autosave');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(stored)project=stored}catch{const s=localStorage.getItem('mockup-studio-autosave');if(s)project=JSON.parse(s)}}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}const slug=v=>String(v||'mockup').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'mockup';function exportProject(){download(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),`${slug(project.name)}.mockupstudio`)}async function importProject(f){const p=JSON.parse(await f.text());if(!p?.canvas||!Array.isArray(p.elements))throw Error('Invalid project');pushHistory();project=p;selectedId=null;renderAll();queueSave();projectDialog.close();showToast('Project imported')}
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function gradient(bg,ctx,w,h){if(!bg.startsWith('linear-gradient'))return bg;const c=[...bg.matchAll(/#[0-9a-fA-F]{6}/g)].map(m=>m[0]),g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,c[0]||'#dbeafe');g.addColorStop(1,c[1]||'#f5d0fe');return g}const loadImage=src=>new Promise((res,rej)=>{const i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=src});async function drawImage(ctx,e){const img=await loadImage(e.src);ctx.save();ctx.globalAlpha=e.opacity??1;ctx.translate(e.x+e.width/2,e.y+e.height/2);ctx.rotate((e.rotation||0)*Math.PI/180);ctx.translate(-e.width/2,-e.height/2);if(e.shadow){ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=Math.max(20,e.width*.055);ctx.shadowOffsetY=Math.max(10,e.width*.025)}if(e.frame==='iphone'){const p=e.width*.034;ctx.fillStyle='#08090b';rr(ctx,0,0,e.width,e.height,e.width*.12);ctx.fill();ctx.shadowColor='transparent';ctx.save();rr(ctx,p,p,e.width-p*2,e.height-p*2,e.width*.096);ctx.clip();ctx.drawImage(img,p,p,e.width-p*2,e.height-p*2);ctx.restore();ctx.fillStyle='#020304';rr(ctx,e.width*.36,e.height*.021,e.width*.28,e.height*.032,e.height*.016);ctx.fill()}else if(e.frame==='browser'){const bar=e.height*.072;ctx.fillStyle='#e9edf3';rr(ctx,0,0,e.width,e.height,e.width*.025);ctx.fill();ctx.shadowColor='transparent';ctx.save();ctx.beginPath();ctx.rect(0,bar,e.width,e.height-bar);ctx.clip();ctx.drawImage(img,0,bar,e.width,e.height-bar);ctx.restore();['#f87171','#fbbf24','#34d399'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(e.width*(.035+i*.028),bar*.5,Math.max(3,bar*.11),0,Math.PI*2);ctx.fill()})}else{ctx.save();rr(ctx,0,0,e.width,e.height,e.radius||0);ctx.clip();ctx.drawImage(img,0,0,e.width,e.height);ctx.restore()}ctx.restore()}
function wrap(ctx,text,w){const lines=[];String(text).split('\n').forEach(p=>{let line='';p.split(/\s+/).forEach(word=>{const t=line?`${line} ${word}`:word;if(ctx.measureText(t).width>w&&line){lines.push(line);line=word}else line=t});lines.push(line)});return lines}function drawText(ctx,e){ctx.save();ctx.globalAlpha=e.opacity??1;ctx.translate(e.x+e.width/2,e.y+e.height/2);ctx.rotate((e.rotation||0)*Math.PI/180);ctx.translate(-e.width/2,-e.height/2);ctx.fillStyle=e.color||'#111827';ctx.font=`${e.bold?800:600} ${e.fontSize||64}px Inter,Arial,sans-serif`;ctx.textBaseline='top';wrap(ctx,e.text||'',e.width).forEach((line,i)=>ctx.fillText(line,0,i*(e.fontSize||64)*1.04));ctx.restore()}async function exportPng(){const b=$('#exportButton');b.disabled=true;b.textContent='Rendering…';try{const c=document.createElement('canvas');c.width=project.canvas.width;c.height=project.canvas.height;const ctx=c.getContext('2d');ctx.fillStyle=gradient(project.canvas.background,ctx,c.width,c.height);ctx.fillRect(0,0,c.width,c.height);for(const e of [...project.elements].sort((a,b)=>(a.z||0)-(b.z||0))){if(e.type==='image')await drawImage(ctx,e);else drawText(ctx,e)}const blob=await new Promise(res=>c.toBlob(res,'image/png'));download(blob,`${slug(project.name)}-${c.width}x${c.height}.png`);showToast('PNG exported')}catch(err){console.error(err);showToast('Export failed')}finally{b.disabled=false;b.textContent='Export PNG'}}
function bind(){uploadButton.onclick=()=>imageInput.click();imageInput.onchange=async()=>{await addFiles(imageInput.files);imageInput.value=''};addTextButton.onclick=addText;undoButton.onclick=undo;redoButton.onclick=redo;fitButton.onclick=fitStage;duplicateButton.onclick=duplicate;deleteButton.onclick=removeSelected;bringFrontButton.onclick=bringFront;exportButton.onclick=exportPng;projectButton.onclick=()=>projectDialog.showModal();newProjectButton.onclick=()=>{pushHistory();project=makeProject();selectedId=null;renderAll();queueSave();projectDialog.close()};saveProjectButton.onclick=async()=>{await saveLocal();showToast('Saved locally')};exportProjectButton.onclick=exportProject;importProjectButton.onclick=()=>projectInput.click();projectInput.onchange=async()=>{try{if(projectInput.files[0])await importProject(projectInput.files[0])}catch{showToast('Invalid project file')}projectInput.value=''};canvasPreset.onchange=e=>canvasPresetFn(e.target.value);$$('[data-layout]').forEach(b=>b.onclick=()=>layout(b.dataset.layout));$$('.swatch').forEach(b=>b.onclick=()=>{pushHistory();project.canvas.background=b.dataset.bg;$$('.swatch').forEach(x=>x.classList.toggle('selected',x===b));renderAll();queueSave()});bindProp('#propX','x');bindProp('#propY','y');bindProp('#propW','width');bindProp('#propH','height');bindRange('#propRotation','rotation','#rotationValue',Number,v=>`${v}°`);bindRange('#propOpacity','opacity','#opacityValue',v=>Number(v)/100,v=>`${v}%`);bindRange('#propRadius','radius','#radiusValue',Number,String);propFrame.onchange=e=>{const x=selected();if(!x)return;pushHistory();x.frame=e.target.value;renderAll();queueSave()};propShadow.onchange=e=>{const x=selected();if(!x)return;pushHistory();x.shadow=e.target.checked;renderAll();queueSave()};propText.onchange=e=>{const x=selected();if(!x)return;pushHistory();x.text=e.target.value;renderAll();queueSave()};bindProp('#propFontSize','fontSize');propColor.onchange=e=>{const x=selected();if(!x)return;pushHistory();x.co
